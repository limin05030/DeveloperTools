name: Build and Release Executables

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        shell: bash
        run: |
          CMD="pyinstaller --windowed -n DeveloperTools main.py --noconfirm"
          
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            ICON="images/app.ico"
            SEP=";"
            CMD="$CMD -F"
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            ICON="images/app.icns"
            SEP=":"
          else  # ubuntu-latest
            ICON="images/app.png"
            SEP=":"
            CMD="$CMD -F"
          fi
          
          if [[ -n "$ICON" ]]; then
            CMD="$CMD --icon=$ICON"
          fi
          
          CMD="$CMD --add-data \"images${SEP}images\""
          
          echo "Running: $CMD"
          eval $CMD
          
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            INFO_PLIST="dist/DeveloperTools.app/Contents/Info.plist"
            VERSION="${{ github.event.inputs.version || github.ref_name }}"
            VERSION=${VERSION#v}
            if [ -f "$INFO_PLIST" ]; then
              # CFBundleShortVersionString
              if /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$INFO_PLIST" &>/dev/null; then
                /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$INFO_PLIST"
              else
                /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $VERSION" "$INFO_PLIST"
              fi
            
              # CFBundleVersion (可能不存在)
              if /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$INFO_PLIST" &>/dev/null; then
                /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 100" "$INFO_PLIST"
              else
                /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 100" "$INFO_PLIST"
              fi
            
              # NSHumanReadableCopyright
              COPYRIGHT="Copyright © 2026 LM. All rights reserved."
              if /usr/libexec/PlistBuddy -c "Print :NSHumanReadableCopyright" "$INFO_PLIST" &>/dev/null; then
                /usr/libexec/PlistBuddy -c "Set :NSHumanReadableCopyright '$COPYRIGHT'" "$INFO_PLIST"
              else
                /usr/libexec/PlistBuddy -c "Add :NSHumanReadableCopyright string '$COPYRIGHT'" "$INFO_PLIST"
              fi
            
              # CFBundleDisplayName
              if /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$INFO_PLIST" &>/dev/null; then
                /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'Developer Tools'" "$INFO_PLIST"
              else
                /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'Developer Tools'" "$INFO_PLIST"
              fi
              echo "✅ Info.plist updated with version $VERSION"
            else
              echo "⚠️ Info.plist not found, skipping version injection"
            fi
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeveloperTools-${{ matrix.os }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files (调试用)
        run: ls -R artifacts
        shell: bash

      - name: Package macOS app with tar
        run: |
          if [ -d "artifacts/DeveloperTools-macos-latest/DeveloperTools.app" ]; then
            cd artifacts/DeveloperTools-macos-latest

            # 保险措施：手动确保可执行文件有执行权限
            chmod +x DeveloperTools.app/Contents/MacOS/DeveloperTools

            tar -czf DeveloperTools-macos.tar.gz DeveloperTools.app
            rm -rf DeveloperTools.app

            cd ../../
            echo "✅ package: artifacts/DeveloperTools-macos-latest/DeveloperTools-macos.tar.gz"
          else
            echo "⚠️ Not found DeveloperTools.app，package skip"
          fi
        shell: bash

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Release ${{ github.event.inputs.version || github.ref_name }}
#          body: |
#            ## 自动构建的发布包
#            - 支持 Windows、Linux、macOS
#            - 使用 PyInstaller 打包，无需额外安装 Python
#            - 更多信息请查看 [README]
          files: |
            artifacts/DeveloperTools-windows-latest/DeveloperTools.exe
            artifacts/DeveloperTools-ubuntu-latest/DeveloperTools
            artifacts/DeveloperTools-macos-latest/DeveloperTools-macos.tar.gz
          fail_on_unmatched_files: true   # 如果任一文件不存在，发布步骤将失败