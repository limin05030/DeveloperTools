name: Build and Release Executables

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: windows-latest
            out_path: dist/DeveloperTools.exe
          - os: ubuntu-latest
            out_path: dist/DeveloperTools
          - os: macos-latest
            out_path: DeveloperTools-macos.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Disable DEBUG_MODE in main.py
        shell: bash
        run: |
          echo "Disabling DEBUG_MODE in main.py"
          python -c "import re; p = 'main.py'; c = open(p).read(); c = re.sub(r'DEBUG_MODE\s*=\s*\w+', 'DEBUG_MODE = False', c); open(p, 'w').write(c)"
          grep "DEBUG_MODE =" main.py


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Update version in index.html
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          echo "Updating version to $VERSION in web/index.html"
          python -c "import sys, re; p = 'web/index.html'; c = open(p).read(); c = re.sub(r'Version: [^<]*', 'Version: ' + sys.argv[1], c); open(p, 'w').write(c)" "$VERSION"

      - name: Build with PyInstaller
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            ICON="images/app.ico"
            SEP=";"
            PYINSTALLER_OPTS="-F"
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            ICON="images/app.icns"
            SEP=":"
            PYINSTALLER_OPTS=""
          else  # ubuntu-latest
            ICON="images/app.png"
            SEP=":"
            PYINSTALLER_OPTS="-F"
          fi
          
          CMD="pyinstaller --windowed -n DeveloperTools main.py --noconfirm $PYINSTALLER_OPTS"
          
          if [[ -n "$ICON" ]]; then
            CMD="$CMD --icon=$ICON"
          fi
          
          CMD="$CMD --add-data \"images${SEP}images\" --add-data \"web${SEP}web\""
          
          echo "Running: $CMD"
          eval $CMD

      - name: Post-build (macOS only)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION=${VERSION#v}
          APP_PATH="dist/DeveloperTools.app"
          INFO_PLIST="$APP_PATH/Contents/Info.plist"
          
          if [ -f "$INFO_PLIST" ]; then
            # CFBundleShortVersionString
            if /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$INFO_PLIST" &>/dev/null; then
              /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$INFO_PLIST"
            else
              /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $VERSION" "$INFO_PLIST"
            fi
          
            # CFBundleVersion (可能不存在)
            if /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$INFO_PLIST" &>/dev/null; then
              /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 100" "$INFO_PLIST"
            else
              /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 100" "$INFO_PLIST"
            fi
          
            # NSHumanReadableCopyright
            COPYRIGHT="Copyright © 2026 LM. All rights reserved."
            if /usr/libexec/PlistBuddy -c "Print :NSHumanReadableCopyright" "$INFO_PLIST" &>/dev/null; then
              /usr/libexec/PlistBuddy -c "Set :NSHumanReadableCopyright '$COPYRIGHT'" "$INFO_PLIST"
            else
              /usr/libexec/PlistBuddy -c "Add :NSHumanReadableCopyright string '$COPYRIGHT'" "$INFO_PLIST"
            fi
          
            # CFBundleDisplayName
            if /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$INFO_PLIST" &>/dev/null; then
              /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'Developer Tools'" "$INFO_PLIST"
            else
              /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'Developer Tools'" "$INFO_PLIST"
            fi
            
            # 🚀 增加 Retina 高分屏支持，解决 UI 模糊和样式缩放问题
            /usr/libexec/PlistBuddy -c "Add :NSHighResolutionCapable bool true" "$INFO_PLIST" || /usr/libexec/PlistBuddy -c "Set :NSHighResolutionCapable true" "$INFO_PLIST"
            
            echo "✅ Info.plist updated with Retina support"
          fi
          
          echo "🔐 Re-signing app bundle..."
          codesign --force --deep --sign - "$APP_PATH"
          echo "✅ Re-signed successfully"
          
          cd dist
          tar -czf ../DeveloperTools-macos.tar.gz DeveloperTools.app
          cd ..

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeveloperTools-${{ matrix.os }}
          path: ${{ matrix.out_path }}

  release:
      needs: build
      runs-on: ubuntu-latest
      permissions:
        contents: write
      steps:
        - name: Download all build artifacts
          uses: actions/download-artifact@v4
          with:
            path: artifacts

        - name: Prepare Assets for Release
          run: |
            mkdir -p release_assets
            find artifacts -type f \( -name "DeveloperTools.exe" -o -name "DeveloperTools" -o -name "*.tar.gz" \) -exec cp {} release_assets/ \;
            ls -R release_assets
          shell: bash

        - name: Create GitHub Release and upload assets
          uses: softprops/action-gh-release@v2
          with:
            tag_name: ${{ github.event.inputs.version || github.ref_name }}
            name: Release ${{ github.event.inputs.version || github.ref_name }}
            files: release_assets/*
            fail_on_unmatched_files: true
