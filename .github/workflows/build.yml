name: Build and Release Executables

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            echo "Building for macOS using .spec file"
            VERSION="${{ github.event.inputs.version || github.ref_name }}"
            # 去掉开头的 'v'（例如 v1.0.0 -> 1.0.0）
            VERSION=${VERSION#v}
            # 修改 .spec 文件中的 CFBundleShortVersionString
            sed -i '' "s/'CFBundleShortVersionString': '.*'/'CFBundleShortVersionString': '$VERSION'/" DeveloperTools.spec
            pyinstaller DeveloperTools.spec
          else
            CMD="pyinstaller --windowed -n DeveloperTools main.py --noconfirm"
            
            if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
              ICON="images/app.ico"
              SEP=";"
              CMD="$CMD -F"
            #elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            #  ICON="images/app.icns"
            #  SEP=":"
            else  # ubuntu-latest
              ICON="images/app.png"
              SEP=":"
              CMD="$CMD -F"
            fi
            
            if [[ -n "$ICON" ]]; then
              CMD="$CMD --icon=$ICON"
            fi
            
            CMD="$CMD --add-data \"images${SEP}images\""
            
            echo "Running: $CMD"
            eval $CMD
          fi

      - name: Strip debug symbols (macOS only)
        if: runner.os == 'macOS'
        run: |
          # Checks if the executable exists before stripping
          if [ -f "dist/DeveloperTools.app/Contents/MacOS/DeveloperTools" ]; then
            strip -S "dist/DeveloperTools.app/Contents/MacOS/DeveloperTools"
            echo "✅ Successfully stripped debug symbols."
          else
            echo "⚠️ Executable not found, skipping strip."
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeveloperTools-${{ matrix.os }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files (调试用)
        run: ls -R artifacts
        shell: bash

      - name: Zip macOS app with ditto
        run: |
          if [ -d "artifacts/DeveloperTools-macos-latest/DeveloperTools.app" ]; then
            # 进入 artifacts 目录
            cd artifacts/DeveloperTools-macos-latest
            
            # 保险措施：手动确保可执行文件有执行权限
            chmod +x DeveloperTools.app/Contents/MacOS/DeveloperTools
            
            # 使用 ditto 命令打包，它能保留权限和签名
            ditto -c -k --keepParent DeveloperTools.app DeveloperTools-macos.zip
            
            # 压缩完成后，可以选择删除原来的 .app 目录以节省空间
            rm -rf DeveloperTools.app
            
            cd ../../
            echo "✅ 已使用 ditto 打包 macOS 应用: artifacts/DeveloperTools-macos-latest/DeveloperTools-macos.zip"
          else
            echo "⚠️ 未找到 DeveloperTools.app，跳过打包"
          fi
        shell: bash

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Release ${{ github.event.inputs.version || github.ref_name }}
#          body: |
#            ## 自动构建的发布包
#            - 支持 Windows、Linux、macOS
#            - 使用 PyInstaller 打包，无需额外安装 Python
#            - 更多信息请查看 [README]
          files: |
            artifacts/DeveloperTools-windows-latest/DeveloperTools.exe
            artifacts/DeveloperTools-ubuntu-latest/DeveloperTools
            artifacts/DeveloperTools-macos-latest/DeveloperTools-macos.zip
          fail_on_unmatched_files: true   # 如果任一文件不存在，发布步骤将失败