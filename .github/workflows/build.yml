name: Build and Release Executables

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: windows-latest
            out_path: dist/DeveloperTools.exe
          - os: ubuntu-latest
            out_path: dist/DeveloperTools
          - os: macos-latest
            out_path: DeveloperTools-macos.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            ICON="images/app.ico"
            SEP=";"
            PYINSTALLER_OPTS="-F"
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            ICON="images/app.icns"
            SEP=":"
            PYINSTALLER_OPTS=""
          else  # ubuntu-latest
            ICON="images/app.png"
            SEP=":"
            PYINSTALLER_OPTS="-F"
          fi
          
          CMD="pyinstaller --windowed -n DeveloperTools main.py --noconfirm $PYINSTALLER_OPTS"
          
          if [[ -n "$ICON" ]]; then
            CMD="$CMD --icon=$ICON"
          fi
          
          CMD="$CMD --add-data \"images${SEP}images\""
          
          echo "Running: $CMD"
          eval $CMD

      - name: Post-build (macOS only)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION=${VERSION#v}
          APP_PATH="dist/DeveloperTools.app"
          INFO_PLIST="$APP_PATH/Contents/Info.plist"
          
          # 1. 修改 Info.plist
          if [ -f "$INFO_PLIST" ]; then
            # CFBundleShortVersionString
            if /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$INFO_PLIST" &>/dev/null; then
              /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$INFO_PLIST"
            else
              /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $VERSION" "$INFO_PLIST"
            fi
          
            # CFBundleVersion (可能不存在)
            if /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$INFO_PLIST" &>/dev/null; then
              /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 100" "$INFO_PLIST"
            else
              /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 100" "$INFO_PLIST"
            fi
          
            # NSHumanReadableCopyright
            COPYRIGHT="Copyright © 2026 LM. All rights reserved."
            if /usr/libexec/PlistBuddy -c "Print :NSHumanReadableCopyright" "$INFO_PLIST" &>/dev/null; then
              /usr/libexec/PlistBuddy -c "Set :NSHumanReadableCopyright '$COPYRIGHT'" "$INFO_PLIST"
            else
              /usr/libexec/PlistBuddy -c "Add :NSHumanReadableCopyright string '$COPYRIGHT'" "$INFO_PLIST"
            fi
          
            # CFBundleDisplayName
            if /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$INFO_PLIST" &>/dev/null; then
              /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'Developer Tools'" "$INFO_PLIST"
            else
              /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'Developer Tools'" "$INFO_PLIST"
            fi
            
            echo "✅ Info.plist updated"
          fi
          
          # 2. 移除调试符号 (注意：必须在签名之前做)
          if [ -f "$APP_PATH/Contents/MacOS/DeveloperTools" ]; then
            strip -S "$APP_PATH/Contents/MacOS/DeveloperTools"
            echo "✅ Binary stripped"
          fi

          # 3. 关键修复：重新执行 Ad-hoc 签名
          # 由于我们修改了 Info.plist 和二进制文件，必须重新签名否则 macOS 会报“已损坏”
          echo "🔐 Re-signing app bundle..."
          codesign --force --deep --sign - "$APP_PATH"
          echo "✅ Re-signed successfully"
          
          # 4. 打包
          cd dist
          tar -czf ../DeveloperTools-macos.tar.gz DeveloperTools.app
          cd ..

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeveloperTools-${{ matrix.os }}
          path: ${{ matrix.out_path }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Assets for Release
        run: |
          mkdir -p release_assets
          find artifacts -type f \( -name "DeveloperTools.exe" -o -name "DeveloperTools" -o -name "*.tar.gz" \) -exec cp {} release_assets/ \;
          ls -R release_assets
        shell: bash

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Release ${{ github.event.inputs.version || github.ref_name }}
          files: release_assets/*
          fail_on_unmatched_files: true
