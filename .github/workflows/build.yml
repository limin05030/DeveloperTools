name: Build and Release Executables

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            ICON="images/app.ico"
            SEP=";"
            PYINSTALLER_OPTS="-F"
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            ICON="images/app.icns"
            SEP=":"
            # macOS 不使用 -F，以保证 .app 束结构完整和依赖收集准确
            PYINSTALLER_OPTS=""
          else  # ubuntu-latest
            ICON="images/app.png"
            SEP=":"
            PYINSTALLER_OPTS="-F"
          fi
          
          CMD="pyinstaller --windowed -n DeveloperTools main.py --noconfirm $PYINSTALLER_OPTS"
          
          if [[ -n "$ICON" ]]; then
            CMD="$CMD --icon=$ICON"
          fi
          
          CMD="$CMD --add-data \"images${SEP}images\""
          
          echo "Running: $CMD"
          eval $CMD

      - name: Post-build (macOS only)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION=${VERSION#v}
          INFO_PLIST="dist/DeveloperTools.app/Contents/Info.plist"
          
          if [ -f "$INFO_PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$INFO_PLIST" || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $VERSION" "$INFO_PLIST"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 100" "$INFO_PLIST" || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 100" "$INFO_PLIST"
            COPYRIGHT=\"Copyright © 2026 LM. All rights reserved.\"
            /usr/libexec/PlistBuddy -c "Set :NSHumanReadableCopyright '$COPYRIGHT'" "$INFO_PLIST" || /usr/libexec/PlistBuddy -c "Add :NSHumanReadableCopyright string '$COPYRIGHT'" "$INFO_PLIST"
            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'Developer Tools'" "$INFO_PLIST" || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'Developer Tools'" "$INFO_PLIST"
            echo "✅ Info.plist updated"
          fi
          
          # 移除调试符号
          if [ -f "dist/DeveloperTools.app/Contents/MacOS/DeveloperTools" ]; then
            strip -S "dist/DeveloperTools.app/Contents/MacOS/DeveloperTools"
          fi
          
          # 在 macOS 运行器上直接打包，保留权限和 App 结构
          cd dist
          tar -czf ../DeveloperTools-macos.tar.gz DeveloperTools.app
          cd ..
          echo "✅ Pre-packaged DeveloperTools-macos.tar.gz"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeveloperTools-${{ matrix.os }}
          path: |
            dist/DeveloperTools.exe
            dist/DeveloperTools
            DeveloperTools-macos.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Assets for Release
        run: |
          mkdir -p release_assets
          # Windows
          [ -f artifacts/DeveloperTools-windows-latest/DeveloperTools.exe ] && cp artifacts/DeveloperTools-windows-latest/DeveloperTools.exe release_assets/
          # Linux
          [ -f artifacts/DeveloperTools-ubuntu-latest/DeveloperTools ] && cp artifacts/DeveloperTools-ubuntu-latest/DeveloperTools release_assets/
          # macOS (已经是 tar.gz)
          [ -f artifacts/DeveloperTools-macos-latest/DeveloperTools-macos.tar.gz ] && cp artifacts/DeveloperTools-macos-latest/DeveloperTools-macos.tar.gz release_assets/
          
          ls -R release_assets
        shell: bash

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Release ${{ github.event.inputs.version || github.ref_name }}
          files: release_assets/*
          fail_on_unmatched_files: true
